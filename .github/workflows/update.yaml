# Move the hermes-agent pin forward, then rebuild — in that order, same run.
#
# The rebuild is a job in THIS workflow rather than a reaction to the commit,
# because a push made with GITHUB_TOKEN deliberately does not trigger other
# workflows. Left to `on: push`, build.yaml would never fire, the pin would
# advance, and the cache would go stale against it without anything failing.
# A stale cache is invisible: the consumer just quietly builds for an hour.
#
# Which release to pin, and whether it is a milestone, are decided by
# ./update.nu. It lives outside this file so it can be run and read on its own —
# `./update.nu --dry-run` answers both questions without writing anything, where
# shell embedded in a workflow can only ever be exercised by pushing it.
name: update

on:
  schedule:
    # Daily, and the frequency is what keeps the channels honest rather than
    # what keeps them fresh.
    #
    # `update.nu` pins whatever `releases/latest` reports, so any release that
    # is superseded before the next run is never pinned and never built. When
    # the one skipped is an `X.Y.0`, the `minor` channel loses that milestone
    # entirely and waits for the next one. Measured against all 32 upstream
    # releases, the expected number of `X.Y.0` releases missed out of 20 is 4.0
    # at weekly, 1.5 at twice weekly and 0.7 daily. It does not reach zero —
    # `0.15.1` followed `0.15.0` by 7h24m — but a fifth of milestones lost is a
    # different thing from a thirtieth.
    #
    # Daily costs nothing extra to build: the number of builds is set by how
    # often upstream releases, not by how often this looks. A run with nothing
    # to do is the `update` job alone, measured at 47s, on a public repo with
    # unlimited free minutes.
    #
    # 12:23 UTC is 21:23 JST, chosen backwards from wanting the cache warm by
    # 07:00 JST — 22:00 UTC. Scheduled runs are best-effort and start late under
    # load: the two observed here ran 4h38m and 4h53m behind. Half an hour of
    # run time and this slot still lands before the deadline with a delay of up
    # to nine hours. Minute 23 rather than 0 because the top of the hour is when
    # the queue is longest.
    - cron: "23 12 * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.update.outputs.changed }}
      channels: ${{ steps.update.outputs.channels }}
      sha: ${{ steps.push.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31.11.1

      # Writes changed / tag / level / channels to $GITHUB_OUTPUT.
      - id: update
        name: Pin the newest upstream release
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./update.nu

      # Both files, always together. flake.nix carries the tag and flake.lock
      # the rev it resolved to; committing one without the other leaves the repo
      # claiming a release it has not locked.
      - id: push
        name: Commit and push
        if: steps.update.outputs.changed == 'true'
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "chore: pin hermes-agent ${{ steps.update.outputs.tag }}" -- flake.nix flake.lock
          git push
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # Only after the commit has landed, so the cache is populated for a pin that
  # actually exists on main.
  #
  # `ref` is not optional decoration. A reusable workflow runs at the commit
  # that started the *caller*, and the push above happened after that, so
  # `github.sha` still names main's previous tip. Left to checkout's default
  # this job would rebuild the old pin, find it already cached, go green in
  # under two minutes, and leave the new pin uncached — with `promote` then
  # advancing `minor` on the strength of it.
  build:
    needs: update
    if: needs.update.outputs.changed == 'true'
    uses: ./.github/workflows/build.yaml
    with:
      ref: ${{ needs.update.outputs.sha }}
    secrets: inherit

  # The release channels. A consumer picks one with a word in its flake URL:
  #
  #   github:asktt1770/nix-hermes-agent          -> main, same commits as patch
  #   github:asktt1770/nix-hermes-agent/patch    -> every release
  #   github:asktt1770/nix-hermes-agent/minor    -> every X.Y.0
  #   github:asktt1770/nix-hermes-agent/major    -> every X.0.0
  #
  # Branches rather than tags or marker files because a branch is the only one
  # of the three a consumer picks once — `nix flake update` then follows it on
  # its own, with nothing to bump by hand and no tooling to write.
  #
  # Which of them a given release advances is decided by update.nu, which
  # reports it as a JSON array so the cascade lives next to the version parsing
  # it depends on rather than in `if:` expressions here. A minor bump advances
  # patch and minor, a major bump advances all three.
  #
  # `major` does not exist yet, and this job is what will create it: `git push`
  # to a ref that has no branch makes one. Upstream has never left `0.x`, so
  # creating it now would leave it frozen for however long that lasts, and a
  # consumer following a frozen channel sees no updates and no errors. An
  # unresolvable branch fails on the spot instead.
  #
  # Every channel only ever points at a commit `main` already passed through, so
  # these are fast-forwards and need no force. They cost no build either: the
  # closure went to Cachix when `main` took the same commit, and the cache is
  # keyed by store path, not by branch.
  #
  # After `build`, not alongside it. A channel should never point a consumer at
  # a pin whose closure failed to compile. `build` being skipped skips this too,
  # which is the intended reading of "nothing changed".
  promote:
    needs: [update, build]
    if: needs.update.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        channel: ${{ fromJSON(needs.update.outputs.channels) }}
    steps:
      # The exact commit `update` pushed, not whatever `main` has drifted to.
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.update.outputs.sha }}
      - run: git push origin HEAD:refs/heads/${{ matrix.channel }}
