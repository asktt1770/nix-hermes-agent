# Move the hermes-agent pin forward, then rebuild — in that order, same run.
#
# The rebuild is a job in THIS workflow rather than a reaction to the commit,
# because a push made with GITHUB_TOKEN deliberately does not trigger other
# workflows. Left to `on: push`, build.yaml would never fire, the pin would
# advance, and the cache would go stale against it without anything failing.
# A stale cache is invisible: the consumer just quietly builds for an hour.
name: update

on:
  schedule:
    # Weekly, which is about the tag cadence upstream keeps (30 releases in the
    # five and a half months to 2026-08-27, so one every ~6 days). Every bump
    # costs a full ~21-minute rebuild, so hourly checks — what nix-claude-code
    # does — suit a flake that only repackages a prebuilt binary, not one that
    # compiles from source.
    - cron: "0 3 * * 1"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.update.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31.11.1

      - id: update
        name: Pin the newest upstream release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # `releases/latest` rather than a sorted `git ls-remote`: upstream's
          # tag namespace also holds non-release refs (`backup/…`,
          # `premerge-oh-god`) that a version sort has no way to tell apart.
          tag=$(gh api repos/NousResearch/hermes-agent/releases/latest --jq .tag_name)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

          sed -i "s|hermes-agent.url = \"github:NousResearch/hermes-agent[^\"]*\"|hermes-agent.url = \"github:NousResearch/hermes-agent/${tag}\"|" flake.nix

          # A sed that matched nothing would leave the old ref in place and the
          # run would report "nothing to update" — the same silent staleness the
          # header of this file is about. Make it a failure instead.
          grep -qF "github:NousResearch/hermes-agent/${tag}\"" flake.nix || {
            echo "::error::could not rewrite the hermes-agent ref in flake.nix"
            exit 1
          }

          nix flake update hermes-agent

          if git diff --quiet -- flake.nix flake.lock; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Both files, always together. flake.nix carries the tag and flake.lock
      # the rev it resolved to; committing one without the other leaves the repo
      # claiming a release it has not locked.
      - name: Commit and push
        if: steps.update.outputs.changed == 'true'
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "chore: pin hermes-agent ${{ steps.update.outputs.tag }}" -- flake.nix flake.lock
          git push

  # Only after the commit has landed, so the cache is populated for a pin that
  # actually exists on main.
  build:
    needs: update
    if: needs.update.outputs.changed == 'true'
    uses: ./.github/workflows/build.yaml
    secrets: inherit
