# Build the cached targets and push them to Cachix.
#
# This lives in a PUBLIC repository on purpose. Public repos get 4-CPU / 16 GB
# runners with unlimited free minutes, and Cachix's free 5 GB tier is
# open-source only. The identical build inside a private consumer repo would get
# 2 CPU / 8 GB and spend a metered minute budget.
name: build

# Filtered to the files that decide what gets built and how. A docs-only commit
# reproduces a store path already in the cache: measured at 1m48s, so this saves
# little time. What it buys is that the run history stays a record of closure
# changes rather than of every typo fix.
#
# `paths` is absent from the two triggers below it because GitHub ignores the key
# there — which is what keeps update.yaml's chained call, and a manual re-run,
# building unconditionally.
on:
  push:
    branches: [main]
    paths:
      - flake.nix
      - flake.lock
      - .github/workflows/build.yaml
  pull_request:
    paths:
      - flake.nix
      - flake.lock
      - .github/workflows/build.yaml
  workflow_dispatch:
  # Called by update.yaml right after it moves the pin — see the note there.
  workflow_call:
    inputs:
      ref:
        description: >-
          Commit to build. update.yaml passes the commit it has just pushed,
          because a reusable workflow runs at the *caller's* commit: `github.sha`
          is main's tip from before that push, so checking out the default would
          rebuild the previous pin and report it green.
        type: string
        required: false
        default: ""

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Empty for every trigger except update.yaml's call, where checkout falls
      # back to its own default of the event's ref.
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      # hermes' closure is ~3.3 GiB, and getting there unpacks several hundred
      # npm and PyPI sources, against a runner image that leaves roughly 14 GB
      # free. Reclaiming the preinstalled SDKs is what keeps this from failing on
      # disk rather than on anything interesting.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          # Skipped: slow (several minutes of apt work) and unnecessary once the
          # tool cache is gone. Turn on if a build ever does run out of space.
          large-packages: false

      - uses: cachix/install-nix-action@v31.11.1

      # Must come BEFORE the build. The action records the store contents up
      # front and pushes whatever appeared by the end of the job. On pull
      # requests from forks the secret is absent and it degrades to pull-only,
      # which is the intended behaviour rather than a failure.
      - uses: cachix/cachix-action@v17
        with:
          name: nix-hermes-agent
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      # `messaging` is the variant the consumer asks for (Iris:
      # `modules/hermes/default.nix`, `.packages.${system}.messaging`), so it
      # goes first and it is the one whose failure stops the run.
      #
      # No `--max-jobs` cap: this runner has 16 GB against the 7.7 GB box that
      # needs the cap. If a run ever dies on memory, `--max-jobs 2` is the first
      # thing to try, and it is worth recording that it happened.
      - name: Build messaging (x86_64-linux)
        run: nix build -L '.#messaging'

      # `default` (= `full`) is a second override of the same `minimal`, not a
      # wrapper around `messaging`. The two closures share 5412 derivations;
      # `default` adds 198 on top (98 wheels, their 98 unpacked forms, a venv
      # and a wrapper) and `messaging` keeps 2 of its own, its venv and its
      # wrapper. So this step pays for the wider dependency groups and reuses
      # everything else verbatim.
      #
      # Built because `default` is what upstream's NixOS and Home Manager
      # modules resolve to when `services.hermes-agent.package` is left alone.
      # Uncached, that default means an hour of local compile on the host this
      # repo exists for.
      #
      # `continue-on-error` because `promote` gates the channel branches on this
      # job, and those channels only ever point a consumer at the `messaging`
      # closure. A break in a group nobody has switched to — `matrix` pulls
      # `python-olm`, `voice` pulls `ctranslate2` and `onnxruntime`, all binary
      # wheels leaning on auto-patchelf — must not hold back a release that
      # built. The step still shows as failed in the run, which is the signal.
      - name: Build default (x86_64-linux)
        continue-on-error: true
        run: nix build -L '.#default'
